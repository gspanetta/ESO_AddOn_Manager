name: "publish"

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    permissions:
      contents: write
    runs-on: "ubuntu-24.04"
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Install pnpm + deps
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
          run_install: true

      - name: Use Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          cache: "pnpm"

      # One runner builds every platform: `neu update` downloads the prebuilt
      # Neutralino binaries (win/mac/linux) and `neu build` packages them all
      # (it even patches the Windows exe metadata on Linux). No Rust, no matrix.
      - name: Fetch Neutralino binaries
        run: pnpm neu:update

      - name: Build
        run: pnpm build

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            dist/wolfs-addon-manager/*