name: Build

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "neutralino.config.json"
      - ".github/workflows/test-build.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: "ubuntu-24.04"
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Install pnpm + deps
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
          run_install: true

      - name: Use Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          cache: "pnpm"

      # `neu update` fetches the prebuilt Neutralino binaries for every platform
      # into bin/. `neu build` then packages all of them in one run (no matrix,
      # no native toolchain) into dist/wolfs-addon-manager/.
      - name: Fetch Neutralino binaries
        run: pnpm neu:update

      - name: Build (type-check + Vite + Neutralino package)
        run: pnpm build

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: wolfs-addon-manager
          path: dist/wolfs-addon-manager/
          if-no-files-found: error